name: "Build and Cache"
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
  workflow_run:
    workflows: ["Check for Updates"]
    types:
      - completed
    branches: [ main ]

jobs:
  build:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
        variant: [codex, codex-node]
        include:
          - os: ubuntu-24.04-arm
            variant: codex
    steps:
    - uses: actions/checkout@v4
      with:
        ref: ${{ github.sha }}

    - uses: cachix/install-nix-action@v31
      with:
        nix_path: nixpkgs=channel:nixos-unstable
        extra_nix_config: |
          experimental-features = nix-command flakes
          access-tokens = github.com=${{ secrets.GITHUB_TOKEN }}
      env:
        NIX_FIRST_BUILD_UID: 400

    - uses: cachix/cachix-action@v15
      if: github.ref == 'refs/heads/main'
      with:
        name: codex-cli
        authToken: '${{ secrets.CACHIX_AUTH_TOKEN }}'

    - name: Build ${{ matrix.variant }}
      run: |
        nix build .#${{ matrix.variant }}

    - name: Check native package portability
      if: matrix.variant == 'codex'
      run: python3 scripts/check-package-portability.py ./result/libexec/codex-package

    - name: Push to Cachix
      if: github.ref == 'refs/heads/main'
      run: |
        nix build .#${{ matrix.variant }} --json | jq -r '.[].outputs.out' | cachix push codex-cli

    - name: Test ${{ matrix.variant }}
      run: |
        bin=./result/bin/${{ matrix.variant }}
        "$bin" --version

        # A short CODEX_HOME keeps the daemon's control socket path within the
        # Unix socket length limit on macOS.
        export CODEX_HOME="$(mktemp -d /tmp/codex-home.XXXXXX)"
        "$bin" app-server daemon start
        "$bin" app-server daemon stop

        if [ "${{ matrix.variant }}" = codex ]; then
          found_rg=false
          while IFS= read -r rg; do
            found_rg=true
            "$rg" --version
            printf 'portable search fixture\n' | "$rg" 'portable search fixture'
          done < <(find "$CODEX_HOME/packages" -type f -path '*/codex-path/rg')
          test "$found_rg" = true
        fi

        # The daemon runs a copy of the package from CODEX_HOME, where nothing
        # keeps the store paths it references from being garbage collected.
        if grep -rlE '/nix/store/[0-9a-z]{32}-' "$CODEX_HOME/packages"; then
          echo "::error::The daemon's package copy references the Nix store"
          exit 1
        fi
