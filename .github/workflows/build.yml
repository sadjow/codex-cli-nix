name: "Build and Cache"
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
  workflow_run:
    workflows: ["Check for Updates"]
    types:
      - completed
    branches: [ main ]

jobs:
  build:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
        variant: [codex, codex-node]
        include:
          - os: ubuntu-24.04-arm
            variant: codex
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        ref: ${{ github.sha }}

    - uses: cachix/install-nix-action@3dc140bfc76c49fbd4dd958429132e3746bcb086 # v31.11.5
      with:
        nix_path: nixpkgs=channel:nixos-unstable
        extra_nix_config: |
          experimental-features = nix-command flakes
          access-tokens = github.com=${{ secrets.GITHUB_TOKEN }}
      env:
        NIX_FIRST_BUILD_UID: 400

    - uses: cachix/cachix-action@38b082610b782e7e93e209c35fd730d399dee866 # v17
      if: github.ref == 'refs/heads/main'
      with:
        name: codex-cli
        authToken: '${{ secrets.CACHIX_AUTH_TOKEN }}'

    - name: Build ${{ matrix.variant }}
      run: |
        nix build .#${{ matrix.variant }}

    - name: Check native search portability
      if: matrix.variant == 'codex'
      run: python3 scripts/check-package-portability.py ./result/lib/codex/codex-path/rg

    - name: Push to Cachix
      if: github.ref == 'refs/heads/main'
      run: |
        nix build .#${{ matrix.variant }} --json | jq -r '.[].outputs.out' | cachix push codex-cli

    - name: Test ${{ matrix.variant }}
      run: |
        bin=./result/bin/${{ matrix.variant }}
        "$bin" --version

        # A short CODEX_HOME keeps the daemon's control socket path within the
        # Unix socket length limit on macOS.
        export CODEX_HOME="$(mktemp -d /tmp/codex-home.XXXXXX)"
        "$bin" app-server daemon start
        "$bin" app-server daemon stop

        if [ "${{ matrix.variant }}" = codex ]; then
          found_rg=false
          while IFS= read -r rg; do
            found_rg=true
            "$rg" --version
            printf 'portable search fixture\n' | "$rg" 'portable search fixture'
          done < <(find "$CODEX_HOME/packages" -type f -path '*/codex-path/rg')
          test "$found_rg" = true
        fi

        # The daemon runs a copy of the package from CODEX_HOME, where nothing
        # keeps the store paths it references from being garbage collected.
        packages="$CODEX_HOME/packages"
        test -d "$packages"
        scan_status=0
        matches=$(grep -rlE '/nix/store/[0-9a-z]{32}-' "$packages") || scan_status=$?
        case $scan_status in
          0)
            echo "::error::The daemon's package copy references the Nix store"
            printf '%s\n' "$matches"
            exit 1
            ;;
          1) ;;
          *)
            echo "::error::Scanning $packages for Nix store references failed"
            exit "$scan_status"
            ;;
        esac
