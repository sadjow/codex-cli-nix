name: Test Pull Request

on:
  pull_request:
    paths:
      - 'package.nix'
      - 'flake.nix'
      - 'flake.lock'
      - '.github/workflows/**'
      - 'scripts/**'
      - 'tests/**'

jobs:
  test-build:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Nix
        uses: cachix/install-nix-action@3dc140bfc76c49fbd4dd958429132e3746bcb086 # v31.11.5
        with:
          nix_path: nixpkgs=channel:nixos-unstable
          extra_nix_config: |
            experimental-features = nix-command flakes
            access-tokens = github.com=${{ secrets.GITHUB_TOKEN }}
        env:
          NIX_FIRST_BUILD_UID: 400

      - name: Setup Nix cache
        uses: cachix/cachix-action@38b082610b782e7e93e209c35fd730d399dee866 # v17
        with:
          name: codex-cli
          authToken: '${{ secrets.CACHIX_AUTH_TOKEN }}'
          skipPush: true

      - name: Run regression tests
        run: nix develop -c python3 -m unittest discover -s tests

      - name: Build package
        run: |
          nix build .#codex --print-build-logs
          nix build .#codex-node --no-link --print-build-logs
          
      - name: Test codex version
        run: |
          # Test that codex runs and reports version
          ./result/bin/codex --version
          
      - name: Verify package contents
        run: |
          test -f ./result/bin/codex
          test -x ./result/bin/codex-code-mode-host
          test -x ./result/lib/codex/bin/codex
          test -x ./result/lib/codex/bin/codex-code-mode-host
          test -f ./result/lib/codex/codex-package.json
          test -x ./result/lib/codex/codex-path/rg
          test -L ./result/bin/codex-code-mode-host

      - name: Run basic functionality test
        run: |
          ./result/bin/codex --help || true
          ./result/bin/codex --version 2>&1 | grep -E "codex|Codex"

      - name: Test terminal daemon bootstrap
        run: python3 scripts/test-terminal.py ./result/bin/codex
